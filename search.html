<script>
Documentation.addTranslations({
  locale: "en",
  plural_expr: "n === 1 ? 0 : 1",
  messages: {
    "Search finished, found one page matching the search query.": [
      "Found one page matching the search query.",
      "Found ${resultCount} pages matching the search query.",
    ],
  },
});
// Sphinx hands the search words to the result page only once. Putting them in the link keeps them for every result opened.
const addHighlight = (event) => {
  const link = event.target.closest("#search-results a");
  const query = new URLSearchParams(window.location.search).get("q");
  if (!link || !query) return;
  const url = new URL(link.href);
  url.searchParams.set("highlight", query);
  link.href = url;
};
document.addEventListener("click", addHighlight);
document.addEventListener("auxclick", addHighlight);
</script>
